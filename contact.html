<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact | Ebenezar Ampofo</title>
    <link rel="stylesheet" href="exercises/css/style.css">
</head>
<body>

    <header class="top-area">
        <nav class="navbar">
            <a href="index.html" class="logo"><img src="images/EA-logo (1).png" alt="EA Logo"></a>

            <ul class="navlinks">
                <li><a href="about.html">About</a></li>
                <li><a href="experience.html">Experience</a></li>
                <li><a href="realapplication.html">Real Application</a></li>
            </ul>

            <a href="contact.html" class="navbutton">Work With Me</a>
        </nav>
    </header>

    <main>

        <!-- Contact -->
        <section class="contact-section">

            <div class="contact-text">
                <h1 class="contact-header">Want to<br>work together?</h1>
                <p class="contact-text2">
                    Reach out and let's talk about how I can bring
                    analytical thinking and real-world experience to your team.
                </p>
            </div>

            <div class="contact-wrap">
                <div class="contact-group">
                    <label class="contact-label" for="name">Name</label>
                    <input class="contact-input" type="text" id="name" placeholder="Your name">
                </div>

                <div class="contact-group">
                    <label class="contact-label" for="email">Email</label>
                    <input class="contact-input" type="email" id="email" placeholder="Your email address">
                </div>

                <div class="contact-group">
                    <label class="contact-label" for="message">Message</label>
                    <textarea class="contact-input contact-textarea" id="message" placeholder="Your message"></textarea>
                </div>

                <button class="contact-button">Send Message</button>
            </div>

        </section>

        <!-- Socials: GitHub left, LinkedIn right -->
        <section class="social-section">

            <a href="https://github.com/EAMPOFO24" class="social-block">
                <img src="images/github-logo.png" alt="GitHub">
                <span>GitHub</span>
            </a>

            <a href="https://www.linkedin.com/in/eampofo/" class="social-block">
                <img src="images/linkedin-logo.png" alt="LinkedIn">
                <span>LinkedIn</span>
            </a>

        </section>

    </main>

</body>
</html>
